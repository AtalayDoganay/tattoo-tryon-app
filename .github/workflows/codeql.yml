name: CodeQL

on:
  push:
    # Long-lived integration branches. A push here is what lands code on a
    # branch other work is cut from, so it gets a full scan of its own rather
    # than relying on whatever PR happened to precede it.
    branches:
      - main
      - feat/face-tattoo-tryon
  pull_request:
    # Both integration branches. Restricting this to `main` meant a PR targeting
    # feat/face-tattoo-tryon -- which is how the hardening work is being
    # reviewed -- never got a CodeQL run at all, so the Security tab stayed
    # silent on exactly the changes that most needed it.
    branches:
      - main
      - feat/face-tattoo-tryon
  schedule:
    # Weekly, so newly-published queries reach existing code without a push.
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Required to upload results to the Security tab.
      security-events: write
      # Required by the CodeQL action to read workflow run metadata.
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        # github/codeql-action v4
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          languages: ${{ matrix.language }}
          # security-extended adds lower-severity and precision-tuned queries on
          # top of the default suite. Supported on public repositories.
          queries: security-extended
          # Vendored agent tooling under .agents/ and .claude/ is not part of
          # the shipped application; scanning it produces noise, not findings.
          config: |
            paths-ignore:
              - .agents
              - .claude
              - node_modules
              - dist

      - name: Autobuild
        # github/codeql-action v4
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81

      - name: Perform CodeQL analysis
        # github/codeql-action v4
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          category: "/language:${{ matrix.language }}"
